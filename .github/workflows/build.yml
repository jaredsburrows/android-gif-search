name: build

on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize ]

# Cancel superseded runs for the same PR/branch (saves runner minutes on rapid pushes, e.g.
# Renovate, and gives faster feedback on the latest commit); let master runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  JAVA_VERSION: 25
  ANDROID_API_LEVEL: "37.1"

permissions:
  checks: write
  pull-requests: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-

      - name: Ktlint, Assemble, Lint, Unit Tests
        run: ./gradlew ktlintCheck assembleDebug lintDebug testDebug -s --continue

      - name: Publish Unit Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: always()
        with:
          comment_mode: off
          check_name: "Unit Test Results"
          action_fail_on_inconclusive: true
          files: |
            app/build/test-results/**/TEST-*.xml

      - name: Upload Reports
        if: github.repository == 'jaredsburrows/android-gif-search' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: com.burrowsapps.gif.search-reports-${{ github.workflow }}-${{ github.run_id }}
          path: |
            app/build/reports
            app/build/test-results

      - name: Upload Debug APK artifact
        if: github.repository == 'jaredsburrows/android-gif-search' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: com.burrowsapps.gif.search-debug-${{ github.workflow }}-${{ github.run_id }}.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumentation:
    name: Instrumentation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install adb service-readiness shim for ps16k emulator
        run: |
          # On google_apis_ps16k, system services (input, settings) may not be registered
          # in ServiceManager yet when sys.boot_completed=1.  The emulator-runner action
          # immediately runs "adb shell input keyevent 82" and "adb shell settings put ..."
          # after detecting boot; if those fail (exit 20) the action aborts before the
          # script: block runs.  This shim retries those commands until services respond.
          REAL_ADB="${ANDROID_HOME}/platform-tools/adb"
          printf '#!/bin/bash\nDELEGATE=%s\n' "$REAL_ADB" > /tmp/adb
          printf '%s\n' \
            'if [[ "$*" == *"shell input keyevent"* ]] || [[ "$*" == *"shell settings put"* ]]; then' \
            '  for i in $(seq 1 30); do' \
            '    out=$("$DELEGATE" "$@" 2>&1); rc=$?' \
            '    if [ $rc -eq 0 ] && ! echo "$out" | grep -q "find service"; then' \
            '      echo "$out"; exit 0' \
            '    fi' \
            '    echo "adb shim: service not ready (attempt $i/30), retrying in 2s..."' \
            '    sleep 2' \
            '  done' \
            '  exit 0' \
            'fi' \
            'exec "$DELEGATE" "$@"' >> /tmp/adb
          chmod +x /tmp/adb
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Cache AVD
        uses: actions/cache@v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api${{ env.ANDROID_API_LEVEL }}-v1
          restore-keys: |
            avd-${{ runner.os }}-api${{ env.ANDROID_API_LEVEL }}-

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis_ps16k
          force-avd-creation: false
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          ram-size: 4096M
          disk-size: 8192M
          emulator-boot-timeout: 1200
          script: echo "Generated AVD snapshot for caching."

      - name: Run Debug Instrumentation Tests (Ran up to 2 times)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis_ps16k
          ram-size: 4096M
          disk-size: 8192M
          emulator-boot-timeout: 1200
          force-avd-creation: false
          emulator-options: -no-snapshot -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            i=0; while [ $i -lt 6 ]; do if adb shell pm path android 2>&1 | grep -q "package:" && adb shell am get-current-user 2>&1 | grep -qE "^[0-9]+$"; then i=$((i+1)); echo "Framework healthy ($i/6)"; else i=0; echo "Framework not stable, resetting"; fi; sleep 5; done; echo "Framework stable"
            ./gradlew connectedDebugAndroidTest -s || ./gradlew connectedDebugAndroidTest -s

      - name: Publish Integration Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: always()
        with:
          comment_mode: off
          check_name: "Integration Test Results"
          action_fail_on_inconclusive: true
          files: |
            app/build/outputs/androidTest-results/**/TEST-*.xml

      - name: Upload Integration Reports
        if: github.repository == 'jaredsburrows/android-gif-search' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: com.burrowsapps.gif.search-androidTest-reports-${{ github.workflow }}-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results

  release:
    name: Release Build (R8 smoke test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Release APK
        run: ./gradlew assembleRelease -s

      - name: Upload Release APK artifact
        if: github.repository == 'jaredsburrows/android-gif-search' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: com.burrowsapps.gif.search-release-${{ github.workflow }}-${{ github.run_id }}.apk
          path: app/build/outputs/apk/release/app-release.apk
